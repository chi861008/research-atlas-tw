/* Carbon + lime interface, derived from the supplied visual reference. */
    :root{--ink:#f4f7f1;--muted:#939a91;--paper:#090b09;--panel:#181b18;--line:#343934;--deep:#101310;--acid:#9dff3b;--blue:#9dff3b;--amber:#9dff3b;--red:#9dff3b;--shadow:0 22px 60px rgba(0,0,0,.38)}

<body>
  <header class="topbar"><div class="brand"><span class="mark">論</span><span>論證 Research Atlas</span></div><div class="topmeta"><a id="accountLink" href="/signin-with-chatgpt?return_to=/" target="_top">登入保存</a></div></header>
  <main>
    <section class="intro"><h1>搜尋跨語言可信論文</h1></section>

    <section class="search-card" aria-label="文獻搜尋">
      <div class="search-row"><input id="query" class="search-input" placeholder="輸入研究主題，例如：生成式 AI 對大學生批判思考的影響" aria-label="研究主題"/><button id="searchBtn" class="primary">搜尋</button></div>
      <div id="searchHint" class="sr-only" aria-live="polite">設定完整條件後按「搜尋」才會開始查詢。</div>
      <div class="collection-toolbar"><span class="collection-caption">收藏分類</span><div class="collection-control"><label class="sr-only" for="collectionFilter">依收藏分類篩選</label><select id="collectionFilter"><option value="all">全部（0）</option></select><button id="manageCollectionsBtn" class="collection-create" type="button">＋ 新增分類</button></div></div>
      <div class="search-options">
        <div class="field"><label for="language">語言</label><select id="language"><option value="">8 種研究語言</option><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option></select></div>
        <div class="field"><label for="fromYear">起始年份</label><input id="fromYear" type="number" min="1950" max="2026" value="2010" /></div>
        <div class="field"><label for="minCited">最低引用數</label><select id="minCited"><option value="0" selected>不限</option><option value="10">10+</option><option value="50">50+</option><option value="100">100+</option></select></div>
        <div class="field"><label for="indexLevel">期刊門檻</label><select id="indexLevel"><option value="credible">公開證據完整</option><option value="all">全部期刊論文</option><option value="licensed">僅 SCI／SSCI／TSSCI 已核驗</option></select></div>
        <div class="field"><label for="requireAbstract">摘要資料</label><select id="requireAbstract"><option value="">允許無摘要</option><option value="yes">必須有公開摘要</option></select></div>
        <div class="field"><label for="oaOnly">全文取用</label><select id="oaOnly"><option value="">不限</option><option value="yes">僅 Open Access</option></select></div>
        <div class="field"><label for="historyToggle">最近研究</label><div id="historyPicker" class="history-picker"><button id="historyToggle" class="history-toggle" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="historyToggleText" class="history-toggle-text">選擇最近主題</span><span class="history-caret">⌄</span></button><div id="historyMenu" class="history-menu" role="listbox" hidden></div></div></div>
      </div>
    </section>

    <div class="status"><div><h2 id="resultTitle">研究證據表</h2><div id="statusCopy" class="status-copy"></div><div id="queryExpansion" class="sr-only"></div><div id="focusAudit" class="sr-only"></div></div><div class="actions"><button id="saveProjectBtn" class="ghost">保存研究專案</button><button id="sortBtn" class="ghost">依引用數排序</button><button id="exportBtn" class="ghost">CSV</button><button id="risBtn" class="ghost">RIS</button><button id="bibBtn" class="ghost">BibTeX</button></div></div>
    <section id="tableShell" class="table-shell" aria-live="polite"><div class="loader"><div class="spinner"></div><span>正在搜尋論文…</span></div><div id="tableHost"><div class="empty"><h3>輸入研究主題並按搜尋</h3></div></div></section>
    <footer class="foot"><a href="/privacy" target="_top">隱私與資料說明</a></footer>
  </main>
  <dialog id="collectionDialog" class="collection-dialog">
    <div class="dialog-body">
      <div class="dialog-head"><div><h3 id="collectionDialogTitle">收藏到分類</h3><p id="collectionPaperTitle">選擇最適合這篇論文的分類。</p></div><button id="closeCollectionDialog" class="dialog-close" aria-label="關閉">×</button></div>
      <label id="collectionSelectLabel" class="dialog-field" for="collectionSelect">收藏分類<select id="collectionSelect"></select></label>
      <div class="new-collection"><input id="newCollectionName" maxlength="30" placeholder="新增分類，例如：結果與討論" aria-label="新分類名稱"/><button id="addCollectionBtn" class="ghost" type="button">建立分類</button></div>
      <div id="collectionList" class="collection-list" aria-label="現有分類"></div>

    </div>

<script>
const $=s=>document.querySelector(s);let papers=[],sortMode='relevance',searchSeq=0,renderSeq=0,showSavedOnly=false,signedIn=false,activeCollection='all',activeSaveKey='',selectedHistory='',cloudHistory=[],lastAudit={candidates:0,focused:0,qualityFiltered:0};
const languages={zh:'中文',en:'英文',ja:'日文',ko:'韓文',es:'西班牙文',fr:'法文',de:'德文',pt:'葡萄牙文'};
const translationCache=new Map();
const summaryCache=new Map();
const retiredCollections=new Set(['未分類','核心文獻','研究方法','理論框架']);
const migrateLegacyCollections=localStorage.getItem('research-atlas-collections-v2')!=='1';
const normalizeCollection=name=>typeof name==='string'?name.trim():'';
const migrateCollection=name=>migrateLegacyCollections&&retiredCollections.has(name)?'':normalizeCollection(name);
const storedCollections=JSON.parse(localStorage.getItem('research-atlas-collections')||'[]').map(migrateCollection).filter(Boolean);
const collections=new Set(storedCollections);
const savedPapers=new Map(JSON.parse(localStorage.getItem('research-atlas-saved')||'[]').map(x=>[x.key,{...x,collection:migrateCollection(x.collection)}]));
localStorage.setItem('research-atlas-collections-v2','1');
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function abstractFromIndex(idx){if(!idx)return '';const out=[];for(const [word,pos] of Object.entries(idx))for(const p of pos)out[p]=word;return out.join(' ')}
function tokens(s){return (s||'').toLowerCase().match(/[\p{L}\p{N}]{2,}/gu)||[]}
const glossary=[
 ['生成式人工智慧','generative artificial intelligence'],['人工智慧','artificial intelligence'],['批判思考','critical thinking'],['大學生','university students'],
 ['女同志','lesbian women sexual minority women queer LGBTQ'],['男同志','gay men sexual minority men queer LGBTQ'],['跨性別','transgender gender diverse'],['雙性戀','bisexual'],['同志','LGBTQ queer sexual minority'],
 ['心理健康','mental health'],['青少年','adolescent youth'],['兒童','children'],['老年','older adults aging'],['教育','education'],['健康','health'],['社群媒體','social media'],
 ['社交場合','social venues community spaces meeting places nightlife'],['女性','women female'],['男性','men male'],['職場','workplace employment'],['歧視','discrimination'],['認同','identity'],['家庭','family'],['親密關係','intimate relationships']
];
function expandQuery(q){let expanded=q,matched=[];for(const [zh,en] of glossary){if(expanded.includes(zh)){matched.push(en);expanded=expanded.replaceAll(zh,' ')}}const remainder=expanded.trim();const search=[...new Set(matched.join(' ').split(' ').filter(Boolean))].join(' ');return{search:search||q,score:[q,search].filter(Boolean).join(' '),matched,used:matched.length>0,remainder}}
function relevance(work,q){const qt=[...new Set(tokens(q))];if(!qt.length)return 0;const hay=(work.title+' '+work.abstract).toLowerCase();const hit=qt.filter(t=>hay.includes(t)).length;const titleHit=qt.filter(t=>work.title.toLowerCase().includes(t)).length;return Math.min(99,Math.round(30+52*hit/qt.length+17*titleHit/qt.length))}
function paperKey(p){return(p.doi||p.id||p.title).toLowerCase()}
function inferDesign(text){const t=(text||'').toLowerCase();if(/meta-analysis|meta analysis/.test(t))return'統合分析';if(/systematic review|scoping review|literature review/.test(t))return'文獻回顧';if(/randomi[sz]ed|controlled trial|\brct\b/.test(t))return'隨機對照研究';if(/longitudinal|follow-up|prospective/.test(t))return'縱貫研究';if(/qualitative|interview|focus group|ethnograph/.test(t))return'質性研究';if(/cross-sectional|survey|questionnaire/.test(t))return'橫斷／調查研究';if(/cohort|population-based/.test(t))return'世代／人口研究';if(/framework|theoretical|conceptual/.test(t))return'理論／概念研究';return'研究設計待確認'}
function inferSample(text){const source=(text||'').replace(/\s+/g,' ');const patterns=[/\b[nN]\s*=\s*([\d,]{2,})\b/,/\b(?:sample|cohort)\s+of\s+([\d,]{2,})\b/i,/\b(?:included|enrolled|recruited|surveyed|interviewed|analyzed|analysed)\s+([\d,]{2,})\s+(?:participants?|respondents?|patients?|students?|adults?|women|men|youths?|children)\b/i,/\b([\d,]{2,})\s+(?:participants?|respondents?|patients?|students?)\s+(?:were|who|completed|participated|included|enrolled|recruited)\b/i];for(const pattern of patterns){const m=source.match(pattern);if(m)return`約 ${m[1]} 人`}return'待確認'}
function qualityScore(p){let s=0;if(p.doi)s+=22;if(p.journal&&p.journal!=='來源未提供')s+=16;if(p.authors&&p.authors!=='作者資料未提供')s+=12;if(p.abstract)s+=22;if(p.topics.length)s+=10;if(p.citations>=10)s+=8;if(p.oa)s+=10;return Math.min(100,s)}
function mapWork(w,originalQ,sourceQuery,sourceLang,searchRank=0){const a=abstractFromIndex(w.abstract_inverted_index);const source=w.primary_location?.source;const doi=w.doi||w.ids?.doi||'';const authors=(w.authorships||[]).slice(0,5).map(x=>x.author?.display_name).filter(Boolean).join(', ');const hasEvidence=Boolean(doi&&source?.display_name&&authors);const issns=[source?.issn_l,...(source?.issn||[])].filter(Boolean);const item={id:w.id,title:w.title||w.display_name||'未命名論文',authors:authors||'作者資料未提供',year:w.publication_year||'—',journal:source?.display_name||'來源未提供',issns:[...new Set(issns)],language:(w.language||sourceLang||'und').toUpperCase(),citations:w.cited_by_count||0,doi,abstract:a,hasEvidence,oa:w.open_access?.is_oa,sourceQuery,sourceLang,searchRank,indexVerification:null,topics:(w.topics||[]).map(x=>({id:x.id,name:x.display_name,score:x.score||0})),keywords:(w.keywords||[]).map(x=>({id:x.id,name:x.display_name,score:x.score||0}))};item.relevance=relevance(item,sourceQuery);item.design=inferDesign(item.title+' '+item.abstract);item.sample=inferSample(item.abstract);item.quality=qualityScore(item);return item}
function journalKey(p){return `${(p.issns||[]).slice().sort().join(',')}|${(p.journal||'').toLowerCase()}`}
async function verifyJournalIndexes(rows){const unique=new Map();for(const p of rows){const key=journalKey(p);if(!unique.has(key))unique.set(key,{key,title:p.journal,issns:p.issns||[]})}if(!unique.size)return;try{const res=await fetch('/api/index-status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({journals:[...unique.values()]})});if(!res.ok)throw new Error('index verification');const data=await res.json(),byKey=new Map((data.results||[]).map(x=>[x.key,x]));for(const p of rows)p.indexVerification=byKey.get(journalKey(p))||{verified:false,state:'unavailable',indexes:[],note:'官方名錄暫時無法連線，因此不宣稱已核驗。'}}catch{for(const p of rows)p.indexVerification={verified:false,state:'unavailable',indexes:[],note:'官方名錄暫時無法連線，因此不宣稱已核驗。'}}}
function indexEvidence(p){const v=p.indexVerification;if(!v)return'<span class="badge warn">索引核驗中</span>';const list=v.indexes||[],indexes=list.join('／');if(v.verified){const checked=v.checkedAt?new Date(v.checkedAt).toLocaleDateString('zh-TW'):'';const links=[list.some(x=>x==='SCIE'||x==='SSCI'||x==='AHCI'||x==='ESCI')?'<a class="link" href="https://mjl.clarivate.com/home" target="_blank" rel="noopener">Clarivate MJL ↗</a>':'',list.includes('TSSCI')?'<a class="link" href="https://hass.hrc.ntu.edu.tw/" target="_blank" rel="noopener">TSSCI 官方制度頁 ↗</a>':''].filter(Boolean).join(' · ');return`<span class="badge good">${esc(indexes)} 已核驗</span><div class="subtle">期刊層級 · ${esc(checked)}<br>${links}<br>${esc(v.note||'')}</div>`}if(v.state==='other-index')return`<span class="badge warn">${esc(indexes)}（非指定門檻）</span><div class="subtle">找到其他 Web of Science 索引，但不是 SCIE／SSCI／TSSCI。</div>`;if(v.state==='unavailable')return'<span class="badge warn">官方核驗暫時無回應</span><div class="subtle">不以推測補值；可稍後重試。</div>';return'<span class="badge warn">未核驗為 SCIE／SSCI／TSSCI</span><div class="subtle">官方名錄未找到精確 ISSN／刊名比對；不代表期刊品質不佳。</div>'}
const weakWords=new Set('the and for with from into among about study research effect effects impact role social health people person women men use using love likes relation relationship de la le les des et und der die das von mit para por los las del el en da do das dos e em um uma'.split(' '));
const strongConceptWords=new Set('lesbian gay bisexual transgender queer lgbtq adolescent youth child children mental venues nightlife workplace discrimination intimate generative artificial critical'.split(' '));
function conceptFocus(items,originalQ){const conceptGroups=expandQuery(originalQ).matched.map(s=>[...new Set(tokens(s).filter(t=>!weakWords.has(t)))]).filter(x=>x.length);const requiredCoverage=conceptGroups.length>=2?1:.5;const directSeeds=items.map(p=>{const qt=[...new Set(tokens(p.sourceQuery).filter(t=>!weakWords.has(t)))];const hay=(p.title+' '+p.abstract).toLowerCase();p.termHits=qt.filter(t=>hay.includes(t));p.groupHits=conceptGroups.filter(group=>{const hits=group.filter(t=>hay.includes(t));return hits.some(t=>strongConceptWords.has(t))||hits.length>=2}).length;p.directCoverage=conceptGroups.length>=2?p.groupHits/conceptGroups.length:(qt.length?p.termHits.length/qt.length:0);return p}).filter(p=>p.directCoverage>=requiredCoverage).sort((a,b)=>a.searchRank-b.searchRank).slice(0,16);const topicCount=new Map(),keywordCount=new Map();for(const p of directSeeds){for(const x of p.topics.slice(0,3))topicCount.set(x.id,{name:x.name,n:(topicCount.get(x.id)?.n||0)+1});for(const x of p.keywords.filter(x=>x.score>=.55).slice(0,8))keywordCount.set(x.id,{name:x.name,n:(keywordCount.get(x.id)?.n||0)+1})}const topicAnchors=new Set([...topicCount].filter(([,v])=>v.n>=2).sort((a,b)=>b[1].n-a[1].n).slice(0,8).map(([id])=>id));const keywordAnchors=new Set([...keywordCount].filter(([,v])=>v.n>=2).sort((a,b)=>b[1].n-a[1].n).slice(0,12).map(([id])=>id));const focused=[];for(const p of items){const matchedTopics=p.topics.filter(x=>topicAnchors.has(x.id));const matchedKeywords=p.keywords.filter(x=>keywordAnchors.has(x.id));const conceptual=matchedTopics.length>0&&matchedKeywords.length>0;const eligible=p.directCoverage>=requiredCoverage||(p.groupHits>0&&conceptual);if(!eligible)continue;const rankSignal=12*Math.max(0,1-p.searchRank/8);const score=Math.min(99,Math.round(42*p.directCoverage+24*Math.min(matchedTopics.length,2)/2+23*Math.min(matchedKeywords.length,3)/3+(p.abstract?10:4)+rankSignal));if(score<42)continue;p.relevance=score;p.matchMode=p.directCoverage>=requiredCoverage?'核心概念同時命中':conceptual?'主題概念擴展':'部分詞義命中';const tier=score>=78?'高度相關':score>=58?'中度相關':'待確認';const topicText=matchedTopics.slice(0,2).map(x=>x.name).join('、');p.relation=`此篇${languages[p.sourceLang]||p.language}論文與「${originalQ}」屬於${tier}，以「${p.matchMode}」納入。${p.termHits.length?`題名或摘要命中「${p.termHits.slice(0,4).join('、')}」。`:''}${topicText?`OpenAlex 主題分類為「${topicText}」。`:''}請用中文摘要與原文確認研究對象、情境及方法。`;focused.push(p)}lastAudit={candidates:items.length,focused:focused.length,qualityFiltered:0};return focused}
async function translateTopic(q,target){if(target==='zh')return q;const key=q+'|'+target;if(translationCache.has(key))return translationCache.get(key);const expanded=expandQuery(q),fallback=expanded.used?expanded.search:q;try{const url=`/api/translate?q=${encodeURIComponent(q)}&from=zh-TW&to=${target}`;const res=await fetch(url);if(!res.ok)throw new Error('translation');const data=await res.json();const translated=(data.responseData?.translatedText||fallback).trim();const enriched=target==='en'&&expanded.used?`${translated} ${expanded.search}`:translated;translationCache.set(key,enriched);return enriched}catch(e){translationCache.set(key,fallback);return fallback}}
function extractSummary(text){const clean=(text||'').replace(/\s+/g,' ').trim();if(!clean)return'';const sentences=clean.split(/(?<=[.!?。！？])\s+/).filter(Boolean);const picked=sentences.length>2?sentences[0]+' '+sentences[sentences.length-1]:sentences.join(' ');return picked.slice(0,430)}
async function makeChineseSummary(p){if(!p.abstract)return'公開索引未提供摘要，因此無法產生中文摘要；請透過 DOI 回到原始來源查證。';if(p.language==='ZH')return extractSummary(p.abstract);const source=extractSummary(p.abstract),key=(p.doi||p.id)+'|zh-summary';if(summaryCache.has(key))return summaryCache.get(key);const from=(p.language||'EN').toLowerCase();try{const url=`/api/translate?q=${encodeURIComponent(source)}&from=${from}&to=zh-TW`;const res=await fetch(url);if(!res.ok)throw new Error('summary translation');const data=await res.json();const result=(data.responseData?.translatedText||'').trim()||'中文摘要暫時無法取得，請查看右側原文摘要。';summaryCache.set(key,result);return result}catch(e){return'中文摘要暫時無法取得，請查看右側原文摘要。'}}
async function hydrateSummaries(rows,stamp){let cursor=0;async function worker(){while(cursor<rows.length){const i=cursor++,p=rows[i];const text=await makeChineseSummary(p);p.zhSummary=text;if(stamp!==renderSeq)return;const el=document.getElementById(`zh-summary-${i}`);if(el){el.classList.remove('loading');el.innerHTML=`${esc(text)}<small>${p.abstract?'公開摘要的機器翻譯節錄':'資料狀態說明'}</small>`}}}await Promise.all([worker(),worker(),worker()])}
function persistCollections(){localStorage.setItem('research-atlas-collections',JSON.stringify([...collections]))}
function collectionCounts(){const counts=new Map([...collections].map(name=>[name,0]));for(const p of savedPapers.values()){const name=normalizeCollection(p.collection);if(!name)continue;if(!collections.has(name))collections.add(name);counts.set(name,(counts.get(name)||0)+1)}return counts}
function renderCollectionControls(){const counts=collectionCounts(),select=$('#collectionFilter'),picker=$('#collectionSelect');const names=[...collections];const options=names.map(name=>`<option value="${esc(name)}">${esc(name)}（${counts.get(name)||0}）</option>`).join('');select.innerHTML=`<option value="all">全部（${savedPapers.size}）</option>${options}`;if(activeCollection!=='all'&&!collections.has(activeCollection))activeCollection='all';select.value=activeCollection;picker.innerHTML=names.length?names.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join(''):'<option value="">尚未建立分類</option>';select._refreshCustomSelect?.();picker._refreshCustomSelect?.();$('#collectionList').innerHTML=names.map(name=>`<button class="collection-chip" type="button" data-collection-filter="${esc(name)}">${esc(name)} · ${counts.get(name)||0}</button>`).join('');document.querySelectorAll('[data-collection-filter]').forEach(btn=>btn.addEventListener('click',()=>{activeCollection=btn.dataset.collectionFilter;showSavedOnly=true;$('#collectionDialog').close();render()}))}
function persistSaved(){localStorage.setItem('research-atlas-saved',JSON.stringify([...savedPapers.values()]));persistCollections();renderCollectionControls()}
function savedPayload(p,key,collection){return{key,id:p.id||'',title:p.title,authors:p.authors,year:p.year,journal:p.journal,issns:p.issns||[],indexVerification:p.indexVerification||null,doi:p.doi,abstract:p.abstract,zhSummary:p.zhSummary||'',relation:p.relation||'',design:p.design,sample:p.sample,quality:p.quality,citations:p.citations,relevance:p.relevance,language:p.language,sourceQuery:p.sourceQuery,hasEvidence:p.hasEvidence??Boolean(p.doi&&p.journal&&p.authors),oa:Boolean(p.oa),collection}}
function openCollectionDialog(key=''){activeSaveKey=key;const saved=savedPapers.get(key),paper=saved||papers.find(x=>paperKey(x)===key);$('#collectionDialogTitle').textContent=key?(saved?'調整收藏分類':'收藏到分類'):'新增與查看分類';$('#collectionPaperTitle').textContent=paper?paper.title:'建立自己的分類，之後可用來篩選收藏論文。';$('#collectionSelectLabel').hidden=!key;$('#confirmCollectionBtn').hidden=!key;$('#removeSavedBtn').hidden=!saved;$('#confirmCollectionBtn').textContent=saved?'更新分類':'加入收藏';renderCollectionControls();if(key){$('#collectionSelect').value=saved?.collection||'';$('#collectionSelect')._refreshCustomSelect?.()}$('#newCollectionName').value='';$('#collectionDialog').showModal()}
function addCollection(){const input=$('#newCollectionName'),name=input.value.trim().replace(/\s+/g,' ');if(!name)return input.focus();collections.add(name.slice(0,30));persistCollections();renderCollectionControls();$('#collectionSelect').value=name.slice(0,30);$('#collectionSelect')._refreshCustomSelect?.();input.value='';if(activeSaveKey)$('#collectionSelectLabel').hidden=false}
function confirmCollection(){if(!activeSaveKey)return;const collection=normalizeCollection($('#collectionSelect').value);let payload=savedPapers.get(activeSaveKey);if(payload)payload={...payload,collection};else{const p=papers.find(x=>paperKey(x)===activeSaveKey);if(!p)return;payload=savedPayload(p,activeSaveKey,collection)}savedPapers.set(activeSaveKey,payload);persistSaved();if(signedIn)fetch('/api/bookmarks',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});$('#collectionDialog').close();render()}
function removeSaved(){if(!activeSaveKey||!savedPapers.has(activeSaveKey))return;savedPapers.delete(activeSaveKey);persistSaved();if(signedIn)fetch(`/api/bookmarks?key=${encodeURIComponent(activeSaveKey)}`,{method:'DELETE'}).catch(()=>{});$('#collectionDialog').close();render()}
function saveHistory(q){const old=JSON.parse(localStorage.getItem('research-atlas-history')||'[]').filter(x=>x.q!==q);old.unshift({q,at:Date.now()});localStorage.setItem('research-atlas-history',JSON.stringify(old.slice(0,10)));loadHistory()}
function setHistoryOpen(open){$('#historyMenu').hidden=!open;$('#historyToggle').setAttribute('aria-expanded',String(open))}
function loadHistory(){const items=JSON.parse(localStorage.getItem('research-atlas-history')||'[]'),menu=$('#historyMenu');if(selectedHistory&&!items.some(x=>x.q===selectedHistory)&&!cloudHistory.some(x=>x.query===selectedHistory)){selectedHistory='';$('#historyToggleText').textContent='選擇最近主題'}const localRows=items.map(x=>`<div class="history-item" role="option"><button class="history-query" type="button" data-history-query="${esc(x.q)}"><span class="history-query-text">${esc(x.q)}</span></button><button class="history-remove" type="button" data-history-remove="${esc(x.q)}" aria-label="刪除搜尋紀錄：${esc(x.q)}">×</button></div>`).join('');const cloudRows=cloudHistory.filter(p=>!items.some(x=>x.q===p.query)).map(p=>`<div class="history-item cloud" role="option"><button class="history-query" type="button" data-history-query="${esc(p.query)}"><span class="history-query-text">${esc(p.title||p.query)}</span></button></div>`).join('');menu.innerHTML=localRows+cloudRows||'<div class="history-empty">尚無搜尋紀錄</div>'}
function selectHistory(q){selectedHistory=q;$('#query').value=q;$('#historyToggleText').textContent=q;setHistoryOpen(false);markSearchPending()}
function deleteHistory(q){const items=JSON.parse(localStorage.getItem('research-atlas-history')||'[]').filter(x=>x.q!==q);localStorage.setItem('research-atlas-history',JSON.stringify(items));if(selectedHistory===q){selectedHistory='';$('#historyToggleText').textContent='選擇最近主題'}loadHistory()}
async function initAccount(){try{const session=await fetch('/api/session').then(r=>r.json());signedIn=Boolean(session.signedIn);const link=$('#accountLink');if(!signedIn){link.textContent='本機保存';link.removeAttribute('href');return}link.textContent=session.displayName||session.email||'已登入';link.href='/signout-with-chatgpt?return_to=/';const cloud=await fetch('/api/bookmarks').then(r=>r.json());for(const item of cloud.bookmarks||[])if(item.key)savedPapers.set(item.key,{...item,collection:migrateCollection(item.collection)});persistSaved();const projects=await fetch('/api/projects').then(r=>r.json());cloudHistory=projects.projects||[];loadHistory()}catch{signedIn=false}}
async function saveCloudProject(){const query=$('#query').value.trim();if(!query)return;if(!signedIn){saveHistory(query);$('#saveProjectBtn').textContent='已保存到本機';setTimeout(()=>$('#saveProjectBtn').textContent='保存研究專案',1800);return}const settings={language:$('#language').value,fromYear:$('#fromYear').value,minCited:$('#minCited').value,requireAbstract:$('#requireAbstract').value,oaOnly:$('#oaOnly').value};const res=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:query,query,settings})});$('#saveProjectBtn').textContent=res.ok?'已保存專案':'保存失敗';setTimeout(()=>$('#saveProjectBtn').textContent='保存研究專案',1800)}
function exportRows(){let visible=showSavedOnly?[...savedPapers.values()]:papers;if(showSavedOnly&&activeCollection!=='all')visible=visible.filter(p=>normalizeCollection(p.collection)===activeCollection);return visible.length?visible:[...savedPapers.values()]}
function downloadText(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportRIS(){const text=exportRows().map(p=>['TY  - JOUR',`TI  - ${p.title}`,`AU  - ${p.authors}`,`PY  - ${p.year}`,`JO  - ${p.journal}`,p.doi?`DO  - ${p.doi.replace('https://doi.org/','')}`:'',`N2  - ${p.zhSummary||p.relation||''}`,'ER  - '].filter(Boolean).join('\n')).join('\n\n');if(text)downloadText('research-atlas.ris','application/x-research-info-systems',text)}
function exportBib(){const text=exportRows().map((p,i)=>`@article{atlas${p.year}${i+1},\n  title={${p.title}},\n  author={${p.authors}},\n  journal={${p.journal}},\n  year={${p.year}}${p.doi?`,\n  doi={${p.doi.replace('https://doi.org/','')}}`:''}\n}`).join('\n\n');if(text)downloadText('research-atlas.bib','application/x-bibtex',text)}
function render(){const stamp=++renderSeq;const host=$('#tableHost');const level=$('#indexLevel').value;let rows=showSavedOnly?[...savedPapers.values()]:[...papers];if(level==='credible')rows=rows.filter(x=>x.hasEvidence??Boolean(x.doi&&x.journal&&x.authors));if(level==='licensed')rows=rows.filter(x=>x.indexVerification?.verified);if(showSavedOnly&&activeCollection!=='all')rows=rows.filter(x=>normalizeCollection(x.collection)===activeCollection);rows.sort((a,b)=>sortMode==='citations'?(b.citations||0)-(a.citations||0):(b.relevance||0)-(a.relevance||0));renderCollectionControls();$('#focusAudit').textContent=lastAudit.candidates?`篩選紀錄：${lastAudit.candidates} 篇候選 → ${lastAudit.focused} 篇概念聚焦${lastAudit.qualityFiltered?` → ${papers.length} 篇符合資料條件`:''}`:'';const verifiedCount=(showSavedOnly?[...savedPapers.values()]:papers).filter(x=>x.indexVerification?.verified).length;$('#statusCopy').textContent=showSavedOnly?`顯示 ${rows.length} 篇收藏${activeCollection==='all'?'':` · ${activeCollection}`}`:level==='licensed'?`顯示 ${rows.length} 篇官方期刊名錄核驗結果（全部結果中 ${verifiedCount} 篇）`:`顯示 ${rows.length} 篇 · ${verifiedCount} 篇通過 SCIE／SSCI／TSSCI 期刊層級核驗`;

 host.innerHTML=`<table><thead><tr><th>論文與作者</th><th>期刊 / 年份</th><th>語言</th><th>樣本數</th><th>摘要</th><th>品質與官方索引</th><th>引用</th></tr></thead><tbody>${rows.map((p,i)=>{const key=paperKey(p),saved=savedPapers.has(key),savedItem=savedPapers.get(key),qualityLabel=p.quality>=80?'完整':p.quality>=60?'中等':'待補';return`<tr><td class="title-cell"><div class="title-hover" tabindex="0" aria-describedby="rel-${i}"><div class="paper-title">${esc(p.title)}</div><div class="relevance-popover" id="rel-${i}" role="tooltip"><div class="relevance-head"><b>與研究主題的關聯性</b><strong>${p.relevance||0}%</strong></div><span class="relevance-meter"><i style="width:${p.relevance||0}%"></i></span><p>${esc(p.relation)}</p></div></div><div class="authors">${esc(p.authors)}</div><div class="subtle">${esc(p.design)}</div>${p.doi?`<a class="link" href="${esc(p.doi)}" target="_blank" rel="noopener">開啟 DOI ↗</a>`:''}<br><button class="saved-btn ${saved?'saved':''}" data-save-key="${esc(key)}">${saved?'調整分類':'加入收藏'}</button>${saved&&savedItem.collection?`<span class="collection-tag">${esc(savedItem.collection)}</span>`:''}</td><td><div class="journal">${esc(p.journal)}</div><div class="subtle">${esc(p.year)} · ${p.oa?'Open Access':'存取狀態未確認'}${p.issns?.length?`<br>ISSN ${esc(p.issns.join(' / '))}`:''}</div></td><td><span class="badge blue">${esc(p.language)}</span><div class="subtle">搜尋詞：${esc(p.sourceQuery)}</div></td><td class="sample-cell"><span class="sample-value">${esc(p.sample||'待確認')}</span><div class="subtle">公開摘要擷取</div></td><td class="summary-cell"><div id="zh-summary-${i}" class="zh-summary ${p.zhSummary?'':'loading'}">${p.zhSummary?`${esc(p.zhSummary)}<small>${p.abstract?'公開摘要的機器翻譯節錄':'資料狀態說明'}</small>`:'正在整理中文摘要…'}</div><div class="abstract-wrap"><button class="abstract-btn" aria-describedby="abs-${i}">${p.abstract?'查看原文摘要':'無原文摘要'}</button><div class="popover" id="abs-${i}" role="tooltip"><b>OpenAlex 收錄摘要</b>${esc(p.abstract||'此筆公開索引沒有提供摘要，請透過 DOI 回到原始來源驗證。')}</div></div></td><td><span class="badge ${p.quality>=80?'good':'warn'}">品質 ${p.quality||0} · ${qualityLabel}</span><div class="subtle">${p.hasEvidence?'DOI＋期刊可追溯':'資料待補'}</div>${indexEvidence(p)}</td><td><b>${(p.citations||0).toLocaleString()}</b><div class="subtle">OpenAlex</div></td></tr>`}).join('')}</tbody></table>`;document.querySelectorAll('[data-save-key]').forEach(btn=>btn.addEventListener('click',()=>openCollectionDialog(btn.dataset.saveKey)));hydrateSummaries(rows,stamp)}
async function search(){const q=$('#query').value.trim();if(!q)return $('#query').focus();showSavedOnly=false;activeCollection='all';$('#searchHint').textContent='正在搜尋與核驗論文…';$('#searchBtn').disabled=true;$('#searchBtn').textContent='搜尋中';const seq=++searchSeq;const year=$('#fromYear').value||2000,selectedLang=$('#language').value,min=$('#minCited').value||0;const isChinese=/[\u3400-\u9fff]/.test(q);const targets=selectedLang?[selectedLang]:(isChinese?Object.keys(languages):['']);$('#tableShell').classList.add('loading');$('#tableHost').innerHTML='';$('#statusCopy').textContent=isChinese?'正在翻譯研究主題並查詢多國論文…':'正在查詢 OpenAlex…';$('#queryExpansion').textContent='';$('#resultTitle').textContent=`「${q}」的研究證據`;
 try{const translated=await Promise.all(targets.map(async lang=>({lang:lang||'all',query:isChinese?await translateTopic(q,lang||'en'):q})));if(seq!==searchSeq)return;$('#queryExpansion').textContent=(isChinese?'跨語言檢索：'+translated.map(x=>`${languages[x.lang]||'全部'}「${x.query}」`).join(' · '):'')+' · 已啟用概念聚焦';const requests=translated.map(async item=>{const filters=[`from_publication_date:${year}-01-01`,`cited_by_count:>${Math.max(0,Number(min)-1)}`,`type:article`];if(item.lang!=='all')filters.push(`language:${item.lang}`);const params=new URLSearchParams({search:item.query,filter:filters.join(','),sort:'relevance_score:desc','per-page':String(selectedLang?25:8),select:'id,doi,title,display_name,publication_year,language,cited_by_count,authorships,primary_location,open_access,abstract_inverted_index,ids,topics,keywords'});const res=await fetch(`/api/openalex?${params}`);if(!res.ok)return[];const data=await res.json();return(data.results||[]).map((w,i)=>mapWork(w,q,item.query,item.lang==='all'?(w.language||'en'):item.lang,i))});const groups=await Promise.all(requests);if(seq!==searchSeq)return;const unique=new Map();for(const item of groups.flat()){const key=(item.doi||item.id||item.title).toLowerCase();const old=unique.get(key);if(!old||item.relevance>old.relevance)unique.set(key,item)}const focused=conceptFocus([...unique.values()],q).sort((a,b)=>b.relevance-a.relevance||b.citations-a.citations);const requireAbstract=$('#requireAbstract').value==='yes',oaOnly=$('#oaOnly').value==='yes';papers=focused.filter(p=>(!requireAbstract||p.abstract)&&(!oaOnly||p.oa)).slice(0,50);lastAudit.qualityFiltered=focused.length-papers.length;$('#statusCopy').textContent=`找到 ${papers.length} 篇，正在以 ISSN 核對官方期刊名錄…`;await verifyJournalIndexes(papers);if(seq!==searchSeq)return;saveHistory(q);render()}catch(e){if(seq!==searchSeq)return;$('#tableHost').innerHTML=`<div class="empty"><h3>目前無法取得跨語言索引</h3><p>翻譯或文獻服務暫時沒有回應。請稍後再試，或先從語言選單指定單一語言。</p></div>`;$('#statusCopy').textContent='跨語言搜尋服務暫時無法使用'}finally{if(seq===searchSeq){$('#tableShell').classList.remove('loading');$('#searchBtn').disabled=false;$('#searchBtn').textContent='搜尋';$('#searchHint').textContent='本次結果已套用上方條件；調整後請再次按「搜尋」。'}}}
function markSearchPending(){const q=$('#query').value.trim();$('#searchHint').textContent=q?'條件尚未套用；確認完成後按「搜尋」。':'輸入研究主題並設定條件，按「搜尋」才會查詢。'}
function closeCustomSelects(except){document.querySelectorAll('.custom-select.open').forEach(picker=>{if(picker===except)return;picker.classList.remove('open');picker.querySelector('.custom-select-toggle').setAttribute('aria-expanded','false');picker.querySelector('.custom-select-menu').hidden=true})}
function initCustomSelects(){document.querySelectorAll('.search-options .field select,#collectionFilter,#collectionSelect').forEach(select=>{const picker=document.createElement('div'),button=document.createElement('button'),menu=document.createElement('div'),label=document.querySelector(`label[for="${select.id}"]`);picker.className='custom-select';button.id=`${select.id}Toggle`;button.className='custom-select-toggle';button.type='button';button.setAttribute('aria-haspopup','listbox');button.setAttribute('aria-expanded','false');menu.id=`${select.id}Menu`;menu.className='custom-select-menu';menu.setAttribute('role','listbox');menu.hidden=true;select.before(picker);picker.append(select,button,menu);select.classList.add('custom-select-native');select.tabIndex=-1;select.setAttribute('aria-hidden','true');if(label)label.htmlFor=button.id;const refresh=()=>{const selected=select.options[select.selectedIndex]||select.options[0];button.innerHTML=`<span class="custom-select-text">${esc(selected?.textContent||'')}</span><span class="custom-select-caret">⌄</span>`;menu.innerHTML=[...select.options].map(option=>`<button class="custom-select-option" type="button" role="option" data-value="${esc(option.value)}" aria-selected="${option.value===select.value}">${esc(option.textContent)}</button>`).join('')};const close=()=>{picker.classList.remove('open');button.setAttribute('aria-expanded','false');menu.hidden=true};const open=()=>{closeCustomSelects(picker);setHistoryOpen(false);picker.classList.add('open');button.setAttribute('aria-expanded','true');menu.hidden=false};button.addEventListener('click',()=>picker.classList.contains('open')?close():open());button.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();open();const options=[...menu.querySelectorAll('.custom-select-option')],selected=menu.querySelector('[aria-selected="true"]');(selected||(e.key==='ArrowUp'?options.at(-1):options[0]))?.focus()}});menu.addEventListener('click',e=>{const option=e.target.closest('.custom-select-option');if(!option)return;select.value=option.dataset.value;select.dispatchEvent(new Event('change',{bubbles:true}));refresh();close();button.focus()});menu.addEventListener('keydown',e=>{const options=[...menu.querySelectorAll('.custom-select-option')],index=options.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();close();button.focus()}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();options[(index+(e.key==='ArrowDown'?1:-1)+options.length)%options.length]?.focus()}});select._refreshCustomSelect=refresh;select.addEventListener('change',refresh);refresh()})}
initCustomSelects();
$('#searchBtn').addEventListener('click',search);$('#query').addEventListener('input',markSearchPending);['language','fromYear','minCited','indexLevel','requireAbstract','oaOnly'].forEach(id=>$('#'+id).addEventListener('change',markSearchPending));$('#historyToggle').addEventListener('click',()=>{closeCustomSelects();setHistoryOpen($('#historyMenu').hidden)});$('#historyMenu').addEventListener('click',e=>{const remove=e.target.closest('[data-history-remove]');if(remove){e.stopPropagation();deleteHistory(remove.dataset.historyRemove);return}const query=e.target.closest('[data-history-query]');if(query)selectHistory(query.dataset.historyQuery)});document.addEventListener('click',e=>{if(!$('#historyPicker').contains(e.target))setHistoryOpen(false);if(!e.target.closest('.custom-select'))closeCustomSelects()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){setHistoryOpen(false);closeCustomSelects()}});$('#saveProjectBtn').addEventListener('click',saveCloudProject);$('#collectionFilter').addEventListener('change',e=>{activeCollection=e.target.value;showSavedOnly=true;render()});$('#manageCollectionsBtn').addEventListener('click',()=>openCollectionDialog());$('#closeCollectionDialog').addEventListener('click',()=>$('#collectionDialog').close());$('#cancelCollectionBtn').addEventListener('click',()=>$('#collectionDialog').close());$('#addCollectionBtn').addEventListener('click',addCollection);$('#newCollectionName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCollection()}});$('#confirmCollectionBtn').addEventListener('click',confirmCollection);$('#removeSavedBtn').addEventListener('click',removeSaved);$('#collectionDialog').addEventListener('click',e=>{if(e.target===$('#collectionDialog'))$('#collectionDialog').close()});$('#sortBtn').addEventListener('click',()=>{sortMode=sortMode==='relevance'?'citations':'relevance';$('#sortBtn').textContent=sortMode==='relevance'?'依引用數排序':'依關聯性排序';render()});
$('#exportBtn').addEventListener('click',()=>{const rows=exportRows();if(!rows.length)return;const cols=['Collection','Title','Authors','Year','Journal','ISSN','Verified indexes','Index verification state','Index checked at','Study design','Sample','Quality','Language','Search query','Chinese relevance note','Chinese abstract','Citations','Relevance','DOI','Original abstract'];const csv=[cols,...rows.map(p=>[p.collection||'',p.title,p.authors,p.year,p.journal,(p.issns||[]).join(' / '),(p.indexVerification?.indexes||[]).join(' / '),p.indexVerification?.state||'',p.indexVerification?.checkedAt||'',p.design||'',p.sample||'',p.quality||'',p.language||'',p.sourceQuery||'',p.relation||'',p.zhSummary||'',p.citations||0,p.relevance||'',p.doi||'',p.abstract||''])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadText('research-atlas.csv','text/csv','\ufeff'+csv)});$('#risBtn').addEventListener('click',exportRIS);$('#bibBtn').addEventListener('click',exportBib);
function registerTools(){const c=document.modelContext;if(!c?.registerTool)return;const ac=new AbortController();Promise.resolve(c.registerTool({name:'search_research_literature',title:'搜尋研究文獻',description:'依研究主題搜尋跨語言期刊論文，並更新頁面上的證據表。',inputSchema:{type:'object',properties:{topic:{type:'string'},fromYear:{type:'integer',minimum:1950,maximum:2026},language:{type:'string'}},required:['topic'],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},async execute(input){if(!input||typeof input.topic!=='string'||!input.topic.trim())throw new Error('topic is required');$('#query').value=input.topic.trim();if(input.fromYear)$('#fromYear').value=input.fromYear;if(input.language!==undefined){$('#language').value=input.language;$('#language')._refreshCustomSelect?.()}await search();return{topic:input.topic,resultCount:papers.length,status:'displayed'}}},{signal:ac.signal})).catch(()=>{})}
